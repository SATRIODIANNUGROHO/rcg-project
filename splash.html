<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PT. Reka Cipta Garam - Salt Weighing System</title>
  <link rel="stylesheet" href="assets/css/fonts.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-drag: none;
    }

    body {
      background: transparent;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }

    .splash-card {
      width: 520px;
      height: 340px;
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 20px;
      box-shadow: 0 25px 60px -15px rgba(15, 23, 42, 0.22), 0 0 0 1px rgba(226, 232, 240, 0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 40px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* Ambient soft background glow */
    .splash-card::before {
      content: '';
      position: absolute;
      top: -50px;
      left: 50%;
      transform: translateX(-50%);
      width: 320px;
      height: 200px;
      background: radial-gradient(circle, rgba(37, 99, 184, 0.08) 0%, rgba(255, 255, 255, 0) 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .splash-logo-container {
      position: relative;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .splash-logo {
      height: 64px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(15, 23, 42, 0.1));
    }

    .splash-title {
      font-size: 22px;
      font-weight: 800;
      color: #0F172A;
      letter-spacing: -0.4px;
      line-height: 1.2;
      margin-bottom: 4px;
    }

    .splash-subtitle {
      font-size: 14.5px;
      font-weight: 600;
      color: #2563EB;
      letter-spacing: 0.1px;
      margin-bottom: 8px;
    }

    .splash-version-badge {
      display: inline-block;
      font-size: 11.5px;
      font-weight: 600;
      color: #1D4ED8;
      background: #EFF6FF;
      border: 1px solid #DBEAFE;
      border-radius: 999px;
      padding: 2.5px 12px;
      letter-spacing: 0.3px;
      margin-bottom: 22px;
    }

    .splash-status-text {
      font-size: 12px;
      font-weight: 600;
      color: #64748B;
      margin-bottom: 10px;
      height: 16px;
      transition: opacity 0.2s ease;
    }

    .splash-progress-track {
      width: 320px;
      height: 6px;
      background: #F1F5F9;
      border: 1px solid #E2E8F0;
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .splash-progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2563EB 0%, #3B82F6 60%, #D69E2E 100%);
      border-radius: 999px;
      transition: width 0.15s linear;
      box-shadow: 0 2px 8px rgba(37, 99, 184, 0.35);
    }
  </style>
</head>
<body>
  <div class="splash-card">
    <div class="splash-logo-container">
      <img src="assets/images/RCG.webp" alt="PT. Reka Cipta Garam" class="splash-logo">
    </div>
    <div class="splash-title">PT. Reka Cipta Garam</div>
    <div class="splash-subtitle">Salt Weighing System</div>
    <div class="splash-version-badge">Version 8.0</div>

    <div class="splash-status-text" id="splash-status">Memuat modul sistem...</div>
    <div class="splash-progress-track">
      <div class="splash-progress-bar" id="splash-progress"></div>
    </div>
  </div>

  <script>
    const progressBar = document.getElementById('splash-progress');
    const statusText = document.getElementById('splash-status');

    const steps = [
      { progress: 20, status: 'Memuat modul sistem...', delay: 100 },
      { progress: 45, status: 'Menyiapkan database lokal...', delay: 400 },
      { progress: 75, status: 'Memeriksa driver timbangan...', delay: 900 },
      { progress: 95, status: 'Menyiapkan antarmuka aplikasi...', delay: 1400 },
      { progress: 100, status: 'Selesai!', delay: 1750 }
    ];

    steps.forEach(step => {
      setTimeout(() => {
        if (progressBar) progressBar.style.width = step.progress + '%';
        if (statusText) statusText.textContent = step.status;
      }, step.delay);
    });
  </script>
</body>
</html>
